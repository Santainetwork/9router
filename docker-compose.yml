services:
  9router:
    build:
      context: .
      dockerfile: Dockerfile
    image: santainetwork/9router:latest
    container_name: 9router
    restart: unless-stopped
    # custom-server.js drains active streams for up to 300s; leave margin for
    # entrypoint child reaping and the Go engine's bounded shutdown.
    stop_grace_period: 330s
    ports:
      - "${GATEWAY_PORT:-20128}:20128"
      - "${PUBLIC_PORT:-20140}:20140"
    volumes:
      - 9router-data:/app/data
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      # Only meaningful under the sqlite-multicore profile; optional so the
      # default single-process SQLite stack starts without Redis.
      redis:
        condition: service_healthy
        required: false
    environment:
      - APP_NAME=${APP_NAME:-SantaiNetwork}
      - DATA_DIR=/app/data
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=512
      - ENABLE_GO_HYBRID=true
      - GATEWAY_PORT=20128
      - PUBLIC_PORT=20140
      - LIMITER_PORT=20129
      - BACKEND_PORT=20127
      - JWT_SECRET=${JWT_SECRET:-}
      - INITIAL_PASSWORD=${INITIAL_PASSWORD:-}
      - MACHINE_ID_SALT=${MACHINE_ID_SALT:-}
      - API_KEY_SECRET=${API_KEY_SECRET:-}
      - DATABASE_URL=${DATABASE_URL:-${BUNDLED_DATABASE_URL:-}}
      - DB_TYPE=${DB_TYPE:-}
      - WORKER_ROLE=${WORKER_ROLE:-control}
      - API_WORKERS=${API_WORKERS:-${BUNDLED_API_WORKERS:-1}}
      - SQLITE_MULTICORE=${SQLITE_MULTICORE:-}
      - REDIS_URL=${REDIS_URL:-}
      - REDIS_KEY_PREFIX=${REDIS_KEY_PREFIX:-}
      - SQLITE_QUEUE_ENCRYPTION_KEY=${SQLITE_QUEUE_ENCRYPTION_KEY:-}
      - HEADROOM_URL=${HEADROOM_URL:-}

  # Optional private Redis for SQLite multicore workers
  # (enable via: docker compose --profile sqlite-multicore up -d).
  # No host port: workers reach it only over the Compose network.
  redis:
    image: redis:7-alpine
    container_name: 9router-redis
    restart: unless-stopped
    profiles: ["sqlite-multicore"]
    # Compose stops dependents first, so the app drains accepted commands and
    # exits before Redis is signalled. Give Redis room to flush AOF on SIGTERM.
    stop_grace_period: 60s
    # Refuse to start an unauthenticated broker: the ACL password must be
    # supplied (the installer writes it to .env). RDB snapshots stay disabled
    # because AOF is the durability mechanism.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$REDIS_PASSWORD" ]; then
          echo "[9router-redis] REDIS_PASSWORD is required for the sqlite-multicore profile" >&2
          exit 1
        fi
        exec redis-server \
          --appendonly yes \
          --appendfsync everysec \
          --maxmemory "$$REDIS_MAXMEMORY" \
          --maxmemory-policy noeviction \
          --requirepass "$$REDIS_PASSWORD" \
          --save ""
    volumes:
      - 9router-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_MAXMEMORY=${REDIS_MAXMEMORY:-256mb}

  # Optional PostgreSQL database (enable via: docker compose --profile postgres up -d)
  postgres:
    image: postgres:16-alpine
    container_name: 9router-postgres
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: 9router
      POSTGRES_USER: 9router
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - 9router-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 9router -d 9router"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:5432:5432"

  # Optional Headroom prompt compression sidecar (enable via: docker compose --profile headroom up -d)
  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: 9router-headroom
    restart: unless-stopped
    profiles: ["headroom"]
    ports:
      - "127.0.0.1:8787:8787"

volumes:
  9router-data:
    name: 9router-data
  9router-redis-data:
    name: 9router-redis-data
  9router-postgres-data:
    name: 9router-postgres-data

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Usage & Quota Check · 9Router</title>
<link rel="icon" href="/favicon.svg" />
<style>
  :root {
    --bg: #FFFDF9;
    --surface: #FFFFFF;
    --surface-alt: #FAF8F5;
    --border: #000000;
    --shadow: #000000;
    --text: #000000;
    --muted: #555555;
    --yellow: #FACC15;
    --cyan: #22D3EE;
    --pink: #F472B6;
    --emerald: #34D399;
    --red: #EF4444;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0B0F19;
      --surface: #111827;
      --surface-alt: #1F2937;
      --border: #FFFFFF;
      --shadow: #FFFFFF;
      --text: #FFFFFF;
      --muted: #9CA3AF;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 48px 16px;
  }
  .wrap { max-width: 660px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
  
  .badge-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge {
    display: inline-flex;
    align-items: center;
    border: 2px solid var(--border);
    padding: 2px 10px;
    font-size: 11px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-radius: 6px;
    box-shadow: 2px 2px 0 var(--shadow);
  }
  .badge-yellow { background: var(--yellow); color: #000; }
  .badge-cyan { background: var(--cyan); color: #000; }
  .badge-pink { background: var(--pink); color: #000; }

  h1 {
    font-size: 32px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.02em;
    margin: 4px 0 0 0;
  }
  p.desc {
    margin: 4px 0 0 0;
    font-size: 14px;
    font-weight: 700;
    color: var(--muted);
  }

  .neo-card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 4px 4px 0 var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .label-title {
    font-size: 12px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  input[type="password"], input[type="text"] {
    width: 100%;
    background: var(--surface-alt);
    border: 2px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    padding: 12px 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 14px;
    font-weight: 700;
    outline: none;
    box-shadow: 3px 3px 0 var(--shadow);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  input:focus {
    background: var(--surface);
  }

  .actions-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 4px;
  }

  .seg {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .seg-label {
    font-size: 12px;
    font-weight: 900;
    text-transform: uppercase;
    margin-right: 4px;
    color: var(--muted);
  }
  .seg button {
    background: var(--surface);
    border: 2px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 900;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 2px 2px 0 var(--shadow);
    transition: all 0.1s;
  }
  .seg button.active {
    background: var(--cyan);
    color: #000;
    transform: translate(-1px, -1px);
  }
  .seg button:hover:not(.active) {
    background: var(--surface-alt);
  }

  .btn-submit {
    background: var(--yellow);
    border: 2px solid var(--border);
    color: #000;
    padding: 10px 20px;
    font-size: 13px;
    font-weight: 900;
    text-transform: uppercase;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--shadow);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.1s;
  }
  .btn-submit:hover {
    background: #fde047;
    transform: translate(-1px, -1px);
  }
  .btn-submit:active {
    transform: translate(2px, 2px);
    box-shadow: none;
  }
  .btn-submit:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .err-box {
    background: var(--red);
    color: #000;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 12px;
    font-weight: 900;
    box-shadow: 3px 3px 0 var(--shadow);
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
  }
  .neo-stat {
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    box-shadow: 3px 3px 0 var(--shadow);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .neo-stat .stat-label {
    font-size: 11px;
    font-weight: 900;
    text-transform: uppercase;
    opacity: 0.85;
  }
  .neo-stat .stat-value {
    font-size: 24px;
    font-weight: 900;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    margin: 8px 0 0 0;
  }
  .neo-stat .stat-sub {
    font-size: 11px;
    font-weight: 700;
    margin: 2px 0 0 0;
    opacity: 0.8;
  }

  .meter-box {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .meter-bar {
    height: 16px;
    width: 100%;
    border: 2px solid var(--border);
    border-radius: 8px;
    background: var(--surface-alt);
    padding: 2px;
    box-shadow: 2px 2px 0 var(--shadow);
  }
  .meter-fill {
    height: 100%;
    border-radius: 4px;
    border-right: 2px solid var(--border);
    transition: width 0.3s ease;
  }

  .pills-container {
    background: var(--surface-alt);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    box-shadow: 3px 3px 0 var(--shadow);
  }
  .pill-item {
    display: inline-block;
    border: 2px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-weight: 900;
    margin: 3px 4px 3px 0;
    box-shadow: 2px 2px 0 var(--shadow);
  }
  .pill-wildcard {
    background: var(--yellow);
    color: #000;
  }

  .model-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 2px solid var(--border);
    font-size: 12px;
  }
  .model-row:last-child {
    border-bottom: none;
  }

  .hidden { display: none !important; }
  .footer { text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); }

  @keyframes neo-pulse {
    0% { transform: scale(0.95); opacity: 0.8; }
    50% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(0.95); opacity: 0.8; }
  }
  .pulse-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--emerald);
    border: 1.5px solid var(--border);
    animation: neo-pulse 2s infinite ease-in-out;
  }
  .pulse-dot.paused {
    background: var(--muted);
    animation: none;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div>
      <div class="badge-row">
        <span class="badge badge-yellow">9Router AI</span>
        <span class="badge badge-cyan">Self-Service Portal</span>
      </div>
      <h1>Usage & Quota Check</h1>
      <p class="desc">Paste your API key below to inspect real-time quotas, token limits, and permitted models.</p>
    </div>

    <!-- Input Card -->
    <div class="neo-card">
      <div class="label-title">Your API Key</div>
      <input id="key" type="password" placeholder="sk-..." aria-label="API key" autocomplete="off" />
      <div class="actions-row">
        <div class="seg">
          <span class="seg-label">Window:</span>
          <div id="periods" style="display:flex;gap:6px;"></div>
        </div>
        <button class="btn-submit" id="checkBtn">
          <span id="checkSpin" class="hidden">⌛</span>
          <span>Inspect Usage ⚡</span>
        </button>
      </div>
      <div id="error" class="err-box hidden"></div>
    </div>

    <!-- Results Section -->
    <div id="results"></div>

    <div class="footer">
      SantaiNetwork 9Router Gateway
    </div>
  </div>

<script>
(function () {
  var PERIODS = [
    { d: 1, label: "1D" },
    { d: 7, label: "7D" },
    { d: 14, label: "14D" },
    { d: 30, label: "30D" }
  ];
  var days = 7;
  var lastData = null;
  var liveActive = true;
  var liveTimer = null;
  var lastLive = null;

  var keyEl = document.getElementById("key");
  var errEl = document.getElementById("error");
  var resEl = document.getElementById("results");
  var checkBtn = document.getElementById("checkBtn");
  var checkSpin = document.getElementById("checkSpin");
  var periodsEl = document.getElementById("periods");

  function fmt(n) {
    var v = Number(n) || 0;
    if (v >= 1e6) return (v / 1e6).toFixed(2) + "M";
    if (v >= 1e3) return (v / 1e3).toFixed(1) + "k";
    return String(Math.round(v));
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function renderPeriods() {
    periodsEl.innerHTML = "";
    PERIODS.forEach(function (p) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = p.label;
      if (p.d === days) b.className = "active";
      b.onclick = function () {
        days = p.d;
        renderPeriods();
        if (lastData) check(p.d);
      };
      periodsEl.appendChild(b);
    });
  }

  function setLoading(on) {
    checkBtn.disabled = on;
    checkSpin.classList.toggle("hidden", !on);
  }
  function showError(msg) {
    if (!msg) { errEl.classList.add("hidden"); errEl.textContent = ""; return; }
    errEl.classList.remove("hidden");
    errEl.textContent = "⚠️ " + msg;
  }

  function render(data) {
    lastData = data;
    if (!data) { resEl.innerHTML = ""; return; }
    var quota = (data.limits && data.limits.tokenQuota) || 0;
    var used = (data.usage && data.usage.tokensUsedAllTime) || 0;
    var remaining = data.usage ? data.usage.tokensRemaining : null;
    var pct = quota > 0 ? Math.min(100, Math.round((used / quota) * 100)) : 0;
    var barColor = pct >= 100 ? "var(--red)" : pct >= 80 ? "var(--yellow)" : "var(--emerald)";
    var pdays = (data.usage && data.usage.period && data.usage.period.days) || days;

    var html = '<div style="display:flex;flex-direction:column;gap:24px;">';

    // Summary Card
    html += '<div class="neo-card">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--border);padding-bottom:12px;">';
    html += '<div style="display:flex;align-items:center;gap:8px;">';
    html += '<span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--emerald);border:2px solid var(--border);"></span>';
    html += '<span style="font-size:14px;font-weight:900;text-transform:uppercase;">' + esc((data.key && data.key.name) || "Your API Key") + '</span>';
    html += '</div>';
    html += '<span class="badge" style="background:var(--surface-alt);color:var(--text);font-family:monospace;">' + esc((data.key && data.key.keyMasked) || "") + '</span>';
    html += '</div>';

    // Meter Box
    html += '<div class="meter-box">';
    html += '<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:900;text-transform:uppercase;">';
    html += '<span>All-Time Token Quota</span>';
    html += '<span style="font-family:monospace;">' + fmt(used) + (quota > 0 ? (' / ' + fmt(quota) + ' (' + pct + '%)') : ' (Unlimited)') + '</span>';
    html += '</div>';
    if (quota > 0) {
      html += '<div class="meter-bar"><div class="meter-fill" style="width:' + pct + '%;background:' + barColor + '"></div></div>';
    }
    html += '</div>';

    // 3 Stats Grid
    html += '<div class="stats-grid">';
    html += '<div class="neo-stat" style="background:var(--cyan);color:#000;">';
    html += '<span class="stat-label">Requests (' + esc(pdays) + 'D)</span>';
    html += '<span class="stat-value">' + fmt(data.usage.requests || data.usage.requestsInPeriod || 0) + '</span>';
    html += '<span class="stat-sub">HTTP requests processed</span>';
    html += '</div>';

    html += '<div class="neo-stat" style="background:var(--pink);color:#000;">';
    html += '<span class="stat-label">Tokens (' + esc(pdays) + 'D)</span>';
    html += '<span class="stat-value">' + fmt(data.usage.totalTokens || data.usage.tokensInPeriod || 0) + '</span>';
    html += '<span class="stat-sub">Prompt + completion</span>';
    html += '</div>';

    html += '<div class="neo-stat" style="background:var(--yellow);color:#000;">';
    html += '<span class="stat-label">Remaining Quota</span>';
    html += '<span class="stat-value">' + (remaining != null ? fmt(remaining) : "Unl") + '</span>';
    html += '<span class="stat-sub">' + (remaining != null ? "Tokens left" : "No hard limit") + '</span>';
    html += '</div>';
    html += '</div>';

    // Live Concurrency Tracker Card
    var limitConcurrency = (data.limits && data.limits.concurrency) || 0;
    var activeSlots = (data.live && data.live.activeConcurrency) || 0;
    var queuedSlots = (data.live && data.live.queuedRequests) || 0;
    var loadPct = limitConcurrency > 0 ? Math.min(100, Math.round((activeSlots / limitConcurrency) * 100)) : 0;
    var meterColor = loadPct >= 100 ? "var(--red)" : loadPct >= 75 ? "var(--yellow)" : "var(--emerald)";

    html += '<div class="pills-container" style="border:2px solid var(--border);box-shadow:3px 3px 0 var(--shadow);margin-top:20px;">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">';
    html += '<div style="display:flex;align-items:center;gap:8px;">';
    html += '<span id="liveDot" class="pulse-dot ' + (liveActive ? '' : 'paused') + '"></span>';
    html += '<span style="font-size:12px;font-weight:900;text-transform:uppercase;">Live Concurrency Tracker</span>';
    html += '<span class="badge" style="background:var(--yellow);color:#000;padding:2px 6px;font-size:10px;">Real-Time</span>';
    html += '</div>';
    html += '<button id="liveBtn" type="button" onclick="toggleLiveTracking()" class="badge" style="background:' + (liveActive ? 'var(--emerald)' : 'var(--surface)') + ';color:#000;cursor:pointer;padding:4px 8px;font-size:10px;">' + (liveActive ? '● Live (2.5s)' : 'Paused') + '</button>';
    html += '</div>';

    html += '<div class="stats-grid" style="grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));">';
    html += '<div class="neo-stat" style="background:var(--surface);color:var(--text);">';
    html += '<span class="stat-label">In-Flight Active</span>';
    html += '<div class="stat-value" id="liveActiveVal" style="font-size:22px;">' + esc(activeSlots) + ' <span style="font-size:12px;color:var(--muted);font-weight:700;">/ ' + (limitConcurrency > 0 ? limitConcurrency : '∞') + '</span></div>';
    html += '<span class="stat-sub" id="liveActiveSub">' + (limitConcurrency > 0 ? (Math.max(0, limitConcurrency - activeSlots) + ' slots free') : 'Unlimited') + '</span>';
    html += '</div>';

    html += '<div class="neo-stat" style="background:var(--surface);color:var(--text);">';
    html += '<span class="stat-label">Buffered in Queue</span>';
    html += '<div class="stat-value" id="liveQueuedVal" style="font-size:22px;">' + esc(queuedSlots) + ' <span style="font-size:12px;color:var(--muted);font-weight:700;">waiting</span></div>';
    html += '<span class="stat-sub" id="liveQueuedSub">' + (queuedSlots > 0 ? 'Queued requests' : 'Queue idle') + '</span>';
    html += '</div>';

    html += '<div class="neo-stat" style="background:var(--surface);color:var(--text);">';
    html += '<span class="stat-label">Concurrency Load</span>';
    html += '<div class="stat-value" id="liveLoadVal" style="font-size:22px;">' + (limitConcurrency > 0 ? (loadPct + '%') : '0%') + '</div>';
    html += '<span class="stat-sub" id="liveLoadSub">' + (activeSlots >= limitConcurrency && limitConcurrency > 0 ? '⚠️ Saturated' : 'Ready') + '</span>';
    html += '</div>';
    html += '</div>';

    if (limitConcurrency > 0) {
      html += '<div style="margin-top:12px;">';
      html += '<div class="meter-bar" style="height:10px;"><div id="liveMeterFill" class="meter-fill" style="width:' + (Math.max(activeSlots > 0 ? 5 : 0, loadPct)) + '%;background:' + meterColor + '"></div></div>';
      html += '</div>';
    }
    html += '</div>';

    // Traffic Throttle Pills
    html += '<div class="pills-container" style="margin-top:16px;">';
    html += '<div style="font-size:11px;font-weight:900;text-transform:uppercase;margin-bottom:8px;">Traffic Throttle Parameters</div>';
    html += '<div>';
    html += '<span class="pill-item">RPM: ' + esc(data.limits.requestsPerMinute > 0 ? data.limits.requestsPerMinute : "Unlimited") + '</span>';
    html += '<span class="pill-item">Concurrency: ' + esc(limitConcurrency > 0 ? limitConcurrency : "Unlimited") + '</span>';
    html += '<span class="pill-item">Queue: ' + esc(data.limits.queueTimeoutMs ? (data.limits.queueTimeoutMs + "ms") : "60s") + '</span>';
    html += '</div>';
    html += '</div>';

    // Allowed Models
    html += '<div>';
    html += '<div style="font-size:11px;font-weight:900;text-transform:uppercase;margin-bottom:8px;">Allowed Models</div>';
    var allowedList = (data.access && data.access.allowedModels) || (data.limits && data.limits.allowedModels) || [];
    if (allowedList.length > 0) {
      html += '<div>';
      allowedList.forEach(function (m) {
        var isWildcard = m.indexOf("*") !== -1;
        html += '<span class="pill-item ' + (isWildcard ? 'pill-wildcard' : '') + '">' + esc(m) + '</span>';
      });
      html += '</div>';
    } else {
      html += '<span style="font-size:12px;font-weight:700;color:var(--muted);">All models permitted (unrestricted).</span>';
    }
    html += '</div>';

    html += '</div>'; // End Summary Card
    html += '</div>';
    resEl.innerHTML = html;
  }

  function stopLivePolling() {
    if (liveTimer) {
      clearInterval(liveTimer);
      liveTimer = null;
    }
  }

  function startLivePolling() {
    stopLivePolling();
    if (!liveActive) return;
    liveTimer = setInterval(function () {
      var k = keyEl.value.trim();
      if (!k || !lastData) return;
      var xhr = new XMLHttpRequest();
      xhr.open("GET", "/api/v1/usage?live=1");
      xhr.setRequestHeader("Authorization", "Bearer " + k);
      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            var res = JSON.parse(xhr.responseText);
            if (res && res.live) {
              lastLive = res.live;
              updateLiveUI(res.live, res.limits);
            }
          } catch (e) {}
        }
      };
      xhr.send();
    }, 2500);
  }

  function updateLiveUI(live, limits) {
    if (!live) return;
    var limit = (limits && limits.concurrency) || (lastData && lastData.limits && lastData.limits.concurrency) || 0;
    var active = live.activeConcurrency || 0;
    var queued = live.queuedRequests || 0;
    var pct = limit > 0 ? Math.min(100, Math.round((active / limit) * 100)) : 0;
    var color = pct >= 100 ? "var(--red)" : pct >= 75 ? "var(--yellow)" : "var(--emerald)";

    var actEl = document.getElementById("liveActiveVal");
    var actSub = document.getElementById("liveActiveSub");
    if (actEl) actEl.innerHTML = esc(active) + ' <span style="font-size:12px;color:var(--muted);font-weight:700;">/ ' + (limit > 0 ? limit : '∞') + '</span>';
    if (actSub) actSub.textContent = limit > 0 ? (Math.max(0, limit - active) + ' slots free') : 'Unlimited';

    var qEl = document.getElementById("liveQueuedVal");
    var qSub = document.getElementById("liveQueuedSub");
    if (qEl) qEl.innerHTML = esc(queued) + ' <span style="font-size:12px;color:var(--muted);font-weight:700;">waiting</span>';
    if (qSub) qSub.textContent = queued > 0 ? 'Queued requests' : 'Queue idle';

    var ldEl = document.getElementById("liveLoadVal");
    var ldSub = document.getElementById("liveLoadSub");
    if (ldEl) ldEl.textContent = limit > 0 ? (pct + '%') : '0%';
    if (ldSub) ldSub.textContent = active >= limit && limit > 0 ? '⚠️ Saturated' : 'Ready';

    var mfEl = document.getElementById("liveMeterFill");
    if (mfEl) {
      mfEl.style.width = Math.max(active > 0 ? 5 : 0, pct) + '%';
      mfEl.style.background = color;
    }
  }

  window.toggleLiveTracking = function () {
    liveActive = !liveActive;
    var btn = document.getElementById("liveBtn");
    var dot = document.getElementById("liveDot");
    if (btn) {
      btn.textContent = liveActive ? "● Live (2.5s)" : "Paused";
      btn.style.background = liveActive ? "var(--emerald)" : "var(--surface)";
    }
    if (dot) {
      dot.className = "pulse-dot " + (liveActive ? "" : "paused");
    }
    if (liveActive) {
      startLivePolling();
    } else {
      stopLivePolling();
    }
  };

  function check(period) {
    var k = keyEl.value.trim();
    if (!k) { stopLivePolling(); showError("Enter an API key first"); return; }
    showError("");
    setLoading(true);

    var xhr = new XMLHttpRequest();
    xhr.open("GET", "/api/v1/usage?period=" + (period || days) + "d");
    xhr.setRequestHeader("Authorization", "Bearer " + k);
    xhr.onload = function () {
      setLoading(false);
      try {
        var data = JSON.parse(xhr.responseText);
        if (xhr.status >= 200 && xhr.status < 300) {
          render(data);
          startLivePolling();
        } else {
          stopLivePolling();
          render(null);
          showError(data.error || ("Request failed (" + xhr.status + ")"));
        }
      } catch (e) {
        stopLivePolling();
        render(null);
        showError("Invalid response from server");
      }
    };
    xhr.onerror = function () {
      stopLivePolling();
      setLoading(false);
      render(null);
      showError("Network error. Is the server running?");
    };
    xhr.send();
  }

  keyEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); check(); }
  });
  checkBtn.addEventListener("click", function () { check(); });

  renderPeriods();
})();
</script>
</body>
</html>

# Public-share reverse proxy for 9Router (SantaiNetwork)
#
# Purpose: expose ONLY the public surface (usage-check page + /v1 API) of the
# 9router prod instance on :20128, and hard-block everything admin.
#
# Edge chain (from the client):
#   client -> Cloudflare (DNS/proxy/TLS) -> Safeline WAF (other node) -> THIS nginx -> 9router :20128
#
# Point Safeline's upstream at this nginx port (default 8443 below), NOT directly
# at :20128, so the admin dashboard/API can never be reached from the internet.
#
# The usage-check page is served from disk (deploy/usage-check.html) — it does
# NOT need to be deployed on prod :20128. Only /api/v1/usage must exist upstream.
#
# Install (Debian/Ubuntu):
#   sudo apt-get install -y nginx
#   sudo bash deploy/install-public-nginx.sh

upstream ninerouter_prod {
    server 127.0.0.1:20128;
    keepalive 32;
}

server {
    listen 8443;
    listen [::]:8443;
    server_name _;                 # Safeline sets the real Host; match anything.

    # Body size for chat payloads (tune as needed).
    client_max_body_size 25m;

    # --- Shared proxy headers ---
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;  # preserve https from edge
    proxy_set_header Connection        "";
    proxy_read_timeout 300s;          # long-lived streaming responses
    proxy_buffering off;              # stream SSE/chat tokens promptly

    # ------------------------------------------------------------------
    # PUBLIC allowlist
    # ------------------------------------------------------------------

    # Self-contained usage-check page (inline CSS/JS, no Next chunks). Served
    # straight from disk so we never have to expose /_next/static publicly.
    # Installer replaces this placeholder with the resolved usage-check.html path.
    location = /usage-check {
        default_type text/html;
        add_header Cache-Control "no-store";
        alias "__USAGE_CHECK_HTML__";
    }

    # Public API: OpenAI-compatible surface + self-service usage.
    # /v1/* is rewritten to /api/v1/* inside 9router; the page fetches
    # /api/v1/usage same-origin, so both prefixes must be allowed.
    location /v1/ {
        proxy_pass http://ninerouter_prod;
    }
    location /api/v1/ {
        proxy_pass http://ninerouter_prod;
    }
    location /v1beta/ {
        proxy_pass http://ninerouter_prod;
    }

    # Favicon/manifest are harmless; allow so the page doesn't 404-spam.
    location = /favicon.ico { proxy_pass http://ninerouter_prod; }
    location = /favicon.svg { proxy_pass http://ninerouter_prod; }
    location = /manifest.webmanifest { proxy_pass http://ninerouter_prod; }

    # ------------------------------------------------------------------
    # Everything else (admin dashboard, /api/keys, /api/queue, /api/providers,
    # /login, /callback, ...) is denied. Return 404 to avoid confirming routes.
    # ------------------------------------------------------------------
    location / {
        return 404;
    }
}
